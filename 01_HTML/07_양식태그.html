<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>양식태그</title>
</head>
<body>
    <label>화초이름을 입력하세요.</label><br>
    <input type="text" placeholder="최대 10자 이내로 작성하시오"> <br>
    <button>확인</button>

    <br>
    <br>
    <hr>
    아이디 <br>
    <input type="text"> <br>
    비밀번호 <br>
    <input type="password"> <br>
    <hr>
    <hr>
    <h2>form</h2>
    <form action="http://127.0.0.1:9999/html" method="get">
      키워드 : <input type="text" name="query">
        <button type="submit"> 요청보내기 </button>
    </form>
    <hr>
    <hr>
    <form action="http://127.0.0.1:9999/login" method="post">
        아이디 <input type="text" name="userId"><br>
        비밀번호 <input type="password" name="userPwd"> <br>
        <button type="submit">로그인</button>
    </form>
    
    <h3>fieldset/legend</h3>
    <form action="legend">
        <fieldset>
            <legend>회원정보</legend>
            *아이디<br>
            <input type="text" 
                    name="id" 
                    placeholder="아이디 필수" 
                    required><br>
            *비밀번호<br>
            <input type="text"
                    name="pwd" 
                    placeholder="비밀번호는 최대 4글자"
                    maxlength="4"><br>
        </fieldset>
        <fieldset>
            전화번호 <br>
            <input type="tel"><br>
            검색 <br>
            <input type="search"><br>
            URL <br>
            <input type="url"><br>
            email <br>
            <input type="email">
        </fieldset>
        * 는 필수 입력사항입니다. <br>            
        <button type="submit">요청보내기</button>
    </form>

 
    <form action="서버주소">
        <fieldset>
            <legend>오늘의 일기</legend>
            제목: <input type="text" name="title" size="50"/><br>
            내용: <br>
            <textarea name="content"
                        cols="58"
                        rows="10" 
                        style="resize:none"
                    ></textarea>
            <hr>
            <button type="submit">일기 작성하기</button>
        </fieldset>

        <hr>
        <fieldset>
            <legend>숫자관련</legend>
            나이: <input type="number" value="0" 
                    min="0" max="20" step="5"/>
            <br>
            <label id="result"></label> <br>

            가격: 
            <input type="range" name="highPrice" min="0" max="1000000" id="price"/>
         </fieldset>
    
<hr>
<fieldset>
    date: <input type="date"/> <br/>
    month: <input type="month"/><br/>
    week: <input type="week"/><br/>
    time: <input type="time"/><br/>
    datetime-local: <input type="datetime-local"/>
</fieldset>    
    
    
</form>
<hr/>
<form action="checked">
<h4>type="radio"</h4>
투숙객평가점수 <br/>
<input type="radio" name="review" value="9+"/> 9+최고<br/>
<input type="radio" name="review" value="8+"/> 8+우수<br/>
<hr>
<h4>checkbox</h4>
<input type="checkbox" name="service" id="aircon" value="에어컨"/> 
<label for="aircon">에어컨</label> <br />
<input type="checkbox" name="service" id="refree" value="냉장고" />
<label for="refree">냉장고</label>  <br />

<button type="submit">요청보내기</button>
<hr>
<fieldset>
    첨부파일: 
    <input type="file" name="" id=""/> <br/>
    색깔고르기:
    <input type="color"/><br/>
    안보임:
    <input type="hidden"/>

</fieldset>
<fieldset>
    제품색
    <select name="color">
        <option>파랑</option>
        <option>빨강</option>
        <option value="black">검정</option>
    </select>

    <hr>
    색상 : <input type="text" list="colors"/>
    <datalist id="colors">
        <option value="black">파랑</option>
        <option value="red">빨강</option>
    </datalist>
</fieldset>

</form>
</body>
</html>
