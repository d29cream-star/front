<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영역</title>
    <style>
        body{
            padding-bottom: 600px
        }
        div,
        span{
            width:400px;
            height:400px;
            border:1px solid black;
        }


    </style>
</head>
<body>
    <h1>영역이란?</h1>
        <pre>
            HTML의 목적: 문서의 구조를 정의하고 값에 의미를 부여하는 것
        </pre>

    <h4>div : 블럭요소</h4>
    <div>1번 영역</div>
    <div>2번 영역</div>
    <div>3번 영역 세로로 깔아줌</div>
    <h4>span : 인라인요소</h4>
    <span>1번 영역</span><span>2번 영역</span><span>3번 영역</span>
        
    <span>좌</span><span>우</span><span>로 깔아줌</span>
    <hr>
    <h4>현재 문서에 다른 페이지를 끼워넣는 태그</h4>
    <iframe src="03_이미지관련태그.html" frameborder="0"></iframe>
    
</body>
</html>
