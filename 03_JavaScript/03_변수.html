<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable</title>
    <style>
        .area{
            width: 500px;
            min-height:200px;
            border: 1px solid;
        }
    </style>
</head>
<body>
    <h1>변수에 대하여</h1>

    <pre>
        const a = 10;

    </pre>

    <button onclick="variable()">변수를 써보자</button>

    <hr>
    <script>
        var str = "var 전역변수"
        window.onload = function(){
            var str = "var 지역변수";
            console.log(str);
            console.log(window.str);
        };
        console.log(str);
    </script>
    <hr>

    <h2>
        자료형
    </h2>
    <div id="area" class="area"></div>
    <button onclick="printType();">버튼</button>
    <script>
        function printType() {
            const name =`삼각김밥`;
            const price = 1900;
            const isSale = false;
            const material = [`밥`, `김`];
            const maker = {
                제조사 : "KH",
                판매사 : "KH"
            };
            const fn = function(){
                alert("삼각김밥 맛있어요");
            };
            let noVal;
            const area = document.querySelector("#area");
            area.innerHTML = `${typeof name}<br>
                              ${typeof price}<br>
                              ${isSale}<br>
                              ${material}<br>
                              ${maker}<br>
                              ${fn}<br>
                              ${noVal}`;
        }
    </script>
    <h3>string 메소드 + 형변환</h3>
    <button onclick="strMethod()">문자열메소드호출</button>
    <script>
        function strMethod(){
            const str = "Hello World";
            console.log(`길이 : ${str.length}`);

            //const price = "1000";
            const price = "1,000" // 만약 문자가 들어갔다면?;
            const addPrice = 300;
            console.log(price+addPrice); //1000300
            console.log(parseInt(price) + addPrice);  //1300
            console.log(Number(price) + addPrice); //1300

            //만약 문자가 들어갔다면?
            console.log(Number(price)); //NaN
            console.log(parseInt(price)); //1
            console.log(isNaN("abc"));
            console.log(isNaN(123));
            


        }
    </script>


</body>
</html>
