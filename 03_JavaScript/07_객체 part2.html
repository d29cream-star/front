    <h3>Date 객체</h3>
    <button onclick="dateFn()">날짜 사용</button>
    <div id="area1" class="area"></div>
    <script>
        function dateFn(){
            const area = document.querySelector("#area1");
            const date1 = new Date();
            area.innerHTML = `현재 : ${date1} <br>`;

            const date2 = new Date(2027, 4 - 1, 16);
            area.innerHTML += `종강일 : ${date2} <br>`;
            
            const date3 = new Date(2027, 4 - 1, 16, 11, 50, 0);
            area.innerHTML += `종강일 : ${date3} <br>`;

            area.innerHTML += `얼마나 남았나 :${date2-date1}<br>`;
            const dDay = (date2-date1)/(24*60*60*1000);
            alert(`종강일까지 ${Math.ceil(dDay)}일 남았습니다.`);

            area.innerHTML = `
                            ${date1.getFullYear()}년<br>
                            ${date1.getMonth()+1}월<br>
                            ${date1.getDate()}일<br>
                            ${date1.getDay()}요일<br>
                            ${date1.getHours()}시<br>
                            ${date1.getMinutes()}분<br>
                            ${date1.getSeconds()}초<br>
                            `;
        }
             
    </script>
        <h4>브라우저에서 자체적으로 제공하는 객체 => BOM DOM</h4>
        <p>
            Node.js : 자바 스크립트 실행환경

            -BOM(Browser Object Model) : 브라우저 => window, location, screen, navigator
            -DOM(Document Object Model) : HTML문서 => document
             JS 언어 자체엔 없고 브라우저가 끼워팔기 해주는 애들


        </p>

    <h3>setInterval</h3>
    <button onclick="timer()">시계만들기</button>
    <div id="area2" class="area"></div>
    
    <script>
        function timer(){
            const area = document.querySelector("#area2");
            setInterval(()=> {
                const date = new Date();
                const hour = date.getHours();
                const min = date.getMinutes();
                const sec = date.getSeconds();

                area.innerHTML = `${hour} : ${min < 10 ? "0" + min : min} : ${sec < 10 ? "0" + sec : sec}`;
            },1000);
        }
        //멈추려면
        //const 변수명 =setInterval(...); clearInterval(변수명);
    </script>
