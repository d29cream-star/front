<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가맹점 금액</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>
<h2>브랜드별 창업 금액 현황</h2>
기준 년도를 입력하세요 :  <input type="text" id="year">

<!--<button onclick="brand()">찾아보기</button>-->
<div class="d-grid gap-2">
<button onclick="next()" class="btn btn-outline-secondary">다음</button>
</div>
<body>
    <div id="brand-result">
        <table class="table table-hover table table-sm">7
            <thead>
                <tr>
                    <th>기준년도</th>
                    <th>브랜드명</th>
                    <th>업종명</th>
                    <th>금액</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <hr>
    </div>
    <hr>

    <script>
        let page = 1;
        function next(){
            brand(page);
            page++;

        }

        function brand(num){
            let year = document.querySelector("#year").value;
            //$("#year").val()
            if(year==="" || year < 2017 || 2025 < year) {year = 2025;}

            $.ajax({
                url : `https://apis.data.go.kr/1130000/FftcBrandFntnStatsService/getBrandFntnStats?serviceKey=7a12219702092b5e5e683f235fa3e94a9f91313c1b4d55f479bf629b7a4b8799&pageNo=${num}&numOfRows=20&resultType=json&yr=${year}`,
                dataType : 'json',
                success : result => {
                    console.log(result);
                    const items = result.items;
                    console.log(items);
                    const el = items.map(e => `<tr>
                                                <td>${e.yr}</td>
                                                <td>${e.brandNm}</td>
                                                <td>${e.indutyMlsfcNm}</td>
                                                <td>${e.smtnAmt}</td>
                                                 </tr>`).join('');
                    document.querySelector("tbody").innerHTML = el;
                },
            });
        }
    </script>    
    <hr>
    <H1 style="margin-top:1000px">무창포의 역사</H1>

    <div style="padding: 100px" id="museum"></div>
    <hr>
    <button onclick="letsGo()">무창포</button>
    
    <script>
        let pageNo = 1;
        function letsGo(){
            $.ajax({
                url : `https://apis.data.go.kr/4510000/GetMuchangpoBeachPhotoService/getMuchangpoBeachInfo?serviceKey=7a12219702092b5e5e683f235fa3e94a9f91313c1b4d55f479bf629b7a4b8799&pageIndex=1&firstIndex=${pageNo++}&dataType=JSON`,
                dataType : "json",
                success : (result) => {
                    //console.log(result);
                    const item = result.response.body.items.item[0];
                    //console.log(item);
                    const imgs = item.IMG_LIST.map(i =>
                                                    `<img src="${i.imgUrl}" style="height:100%; width: 200px; object-fit:cover" />`).join('');                                     
                                                 
                    const el = `<div sytle="margin: 10px; padding: 8px;">
                                    <h4>${item.TTL}</h4>
                                    <p>등록일 : ${item.REG_YMD}</p>
                                    <div style="display:flex; gap: 6px; height: 160px; overflow-x:auto;">
                                        ${imgs}
                                        </div>
                                </div>`;
                    document.querySelector("#museum").innerHTML = el;
               },

            });
        }

    </script>
<h2>지도 띄우기</h2>


	<div id="map" style="width:500px;height:400px;"></div>

       <script>
		var container = document.getElementById('map');
		var options = {
			center: new kakao.maps.LatLng(33.450701, 126.570667),
			level: 3
		};

		var map = new kakao.maps.Map(container, options);
	</script>



<h2>희귀식물</h2>
<input type="text" id="krname">
<button onclick="plant()">조회하기</button>
<div>

    <table>
        <thead>
            <tr>
                <th>국명</th>
                <th>국내분포지</th>
                <th>특징</th>
                <th>사진</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>   
 </div>
 <hr>
<script>
    
    function plant(){

        $.ajax({
            url:`https://apis.data.go.kr/B554620/rrtyPrntInfoService/getRrtyPrntInfoList?serviceKey=7a12219702092b5e5e683f235fa3e94a9f91313c1b4d55f479bf629b7a4b8799&pageNo=1&numOfRows=10&type=JSON&srchScnm=Silene%20koreana%20Kom.&srchKrnm=%EB%81%88%EB%81%88%EC%9D%B4%EC%9E%A5%EA%B5%AC%EC%B1%84&srchFamlNm=Caryophyllaceae&srchKornFamlNm=%EC%84%9D%EC%A3%BD%EA%B3%BC`,
            dataType: "json",
            success : (result) => {
               //console.log(result);
            const plants = result.response.body.items.item;
               //console.log(plants);
            const el = plants.map( e =>
                        `<tr>
                        <td>국명: ${e.krnm}<td/>,
                        <td>국내분포지: ${e.intrDstbRgnCn}<td/>,
                        <td>특징: ${e.excptnMttrCn}<td/>,
                        <td>사진: <img src="${e.imgUrl}<td/>"
                        </tr>`).join('');
      
                document.querySelector("tbody").innerHTML = el; 
            },
        });
    }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
